<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinéTrack</title>

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- roboto font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Configure Roboto as the default sans/body font in Tailwind v4 -->
    <style>
      body {
        font-family: "Roboto", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#121214] text-white font-sans">
    <header
      class="max-w-7xl mx-auto px-2 border-b-2 mb-[8px] border-[#35353d] h-[80px] flex flex-row justify-between items-center"
    >
      <a href="/Index.html">
        <img
          class="h-[80px] block md:hidden"
          src="/img/Phone Logo.png"
          alt="page logo"
        />

        <img
          class="w-[250px] h-[80px] hidden md:block"
          src="/img/Logo.png"
          alt="page logo"
        />
      </a>
      <button
        class="cursor-pointer p-2 w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#383840]/20 transition-colors"
      >
        <svg
          class="border-2 border-white rounded-full h-9 w-9 p-1 text-white"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </button>
    </header>
    <div
      class="max-w-7xl mx-auto px-2 grid grid-cols-1  lg:grid-cols-12 gap-4 min-h-[calc(100vh-88px)]"
    >
      <main class="lg:col-span-9 grid grid-cols-8 gap-4 content-start py-4 order-2 lg:order-1">
        <div class="col-span-full">
          <div class="flex items-center">
            <button class="relative flex items-center hover:cursor-pointer">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="absolute left-4"
              >
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>
            </button>

            <input
              id="search"
              class="bg-[#27272c] pl-12 h-12 w-full rounded-full mr-2"
              type="search"
              name="search"
              placeholder="Rechercher sur une Films ou Series"
            />
            <select
              class="bg-[#27272c] w-28 px-6 h-12 rounded-full cursor-pointer"
              name="filter"
              id="filter"
            >
              <option value="Tout">Tout</option>
              <option value="Films">Films</option>
              <option value="Series">Series</option>
            </select>
          </div>
        </div>
        <div
          id="cardsContainer"
          class="col-span-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"
        ></div>
        <div
          id="pagination"
          ;
          class="rounded-xl col-span-full flex flex-wrap justify-center items-center gap-4"
        >
          <div class="flex flex-row justify-center items-center gap-3 w-full">
            <button class="rounded-[12px] px-4 py-2 bg-[#0C1E4A]/40 text-white">
              1
            </button>

            <button
              class="hover:cursor-pointer rounded-[12px] px-4 py-2 bg-[#E7E5E4] text-black"
            >
              2
            </button>

            <button
              class="hover:cursor-pointer rounded-[12px] px-4 py-2 bg-[#E7E5E4] text-black"
            >
              3
            </button>
            <button
              class="hover:cursor-pointer rounded-[12px] px-4 py-2 bg-[#E7E5E4] text-black"
            >
              &gt;
            </button>
          </div>
        </div>
      </main>
      <aside class="lg:col-span-3 border-l-2 border-[#35353d] h-full order-1 lg:order-2">
        <h2 class="text-xl px-4">Favorites:</h2>
        <div id="favorite-container" ></div>
      </aside>
    </div>
    <!-- model -->
    <div
      id="modal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center bg-[#121214]/70 backdrop-blur"
      onclick="closeModel()"
    >
      <div
        class="relative bg-[#27272c] border border-[#35353d] rounded-2xl w-full max-w-[800px] p-6 mx-4"
        id="modal-content"
        onclick="event.stopPropagation()"
      >
        <!-- 'X' Close Button -->
        <button
          id="closeModalBtn"
          class="absolute top-4 right-4 text-gray-400 hover:text-white hover:bg-[#35353d] p-1.5 rounded-full transition-colors cursor-pointer"
          onclick="closeModel()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>

      </div>
    </div>

    <footer class="max-w-7xl mx-auto px-2"></footer>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
