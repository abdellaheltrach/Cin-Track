<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinéTrack</title>

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- roboto font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Configure Roboto as the default sans/body font in Tailwind v4 -->
    <style>
      body {
        font-family: "Roboto", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#121214] text-white font-sans">
    <header
      class="max-w-7xl mx-auto px-2 border-b-2 border-[#35353d] h-[80px] flex flex-row justify-between items-center"
    >
      <a href="/Index.html">
        <img class="w-[250px] h-[80px]" src="/img/Logo.png" alt="page logo" />
      </a>
      <button
        class="cursor-pointer p-2 w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#383840]/20 transition-colors"
      >
        <svg
          class="border-2 border-white rounded-full h-9 w-9 p-1 text-white"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </button>
    </header>
    <main class="max-w-7xl mx-auto px-2"></main>
    <aside class="max-w-7xl mx-auto px-2"></aside>
    <footer class="max-w-7xl mx-auto px-2"></footer>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
